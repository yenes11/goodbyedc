[package]
name = "goodbyedc"
version = "0.2.0"
edition = "2021"
description = "Arkadaş grubu için küçük Discord alternatifi"

[dependencies]
eframe = "0.36"
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
futures-util = "0.3"
libwebrtc = "0.4"
sha2 = "0.10"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Kişiye özel ses yüksekliği için küçük bir ekleme (AudioTrack::set_volume) yapılmış kopyalar.
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }
