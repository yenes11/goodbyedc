<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>goodbyedc</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Pencere düğmeleri (Windows/Linux). macOS'ta sistemin kendi düğmeleri kullanılır. -->
  <div class="win-controls">
    <button id="win-min" class="win-btn" title="Küçült" data-icon="winMin"></button>
    <button id="win-max" class="win-btn" title="Büyüt" data-icon="winMax"></button>
    <button id="win-close" class="win-btn close" title="Kapat" data-icon="x"></button>
  </div>

  <!-- Giriş ekranı -->
  <div id="auth" class="auth hidden">
    <div class="auth-drag" data-tauri-drag-region></div>
    <form id="auth-form" class="auth-card">
      <h1>goodbyedc</h1>
      <p class="muted" id="auth-sub">Tekrar hoş geldin!</p>
      <label>Kullanıcı adı
        <input id="auth-user" autocomplete="username" required />
      </label>
      <label>Şifre
        <input id="auth-pass" type="password" autocomplete="current-password" required />
      </label>
      <label id="invite-row" class="hidden">Davet kodu
        <input id="auth-invite" />
      </label>
      <div id="auth-error" class="error"></div>
      <button type="submit" id="auth-submit">Giriş yap</button>
      <p class="muted small">
        <span id="auth-toggle-text">Hesabın yok mu?</span>
        <a href="#" id="auth-toggle">Kayıt ol</a>
      </p>
    </form>
  </div>

  <!-- Ana uygulama -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="server-header" data-tauri-drag-region>
      </header>
      <div id="channels" class="channels"></div>

      <div id="usage" class="usage"></div>

      <div id="voice-panel" class="voice-panel hidden">
        <div>
          <div class="voice-status">Ses bağlandı</div>
          <div id="voice-channel-name" class="muted small"></div>
        </div>
        <div class="voice-actions">
          <button id="btn-screen" class="icon-btn" title="Ekran paylaş" data-icon="monitor"></button>
          <button id="btn-leave" class="icon-btn danger" title="Bağlantıyı kes" data-icon="phoneOff"></button>
        </div>
      </div>

      <footer class="user-panel">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-name" id="me-name"></div>
        <button id="btn-mute" class="icon-btn" title="Sustur" data-icon="mic"></button>
        <button id="btn-deafen" class="icon-btn" title="Sağırlaştır" data-icon="headphones"></button>
        <button id="btn-logout" class="icon-btn" title="Çıkış yap" data-icon="logOut"></button>
      </footer>
    </aside>

    <main class="main">
      <header class="channel-header" data-tauri-drag-region>
        <span id="channel-title" data-tauri-drag-region></span>
        <div class="toolbar" data-tauri-drag-region>
          <span id="conn-status" class="conn-status"></span>
          <button id="btn-update" class="update-pill hidden" title="Yeni sürüm hazır">Güncelle</button>
          <button id="btn-check-update" class="icon-btn" title="Güncellemeleri denetle" data-icon="refresh"></button>
        </div>
      </header>

      <section id="chat" class="chat">
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <input id="composer-input" autocomplete="off" />
        </form>
      </section>

      <section id="stage" class="stage hidden">
        <div class="stage-top">
          <span id="stage-title"></span>
          <button id="stage-close" class="btn-secondary">İzlemeyi bırak</button>
        </div>
        <canvas id="stage-canvas"></canvas>
      </section>

      <section id="empty" class="empty hidden">
        <p class="muted">Bir kanal seç.</p>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Vazgeç</button>
        <button id="modal-ok">Tamam</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
